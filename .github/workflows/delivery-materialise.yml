name: Publish recovered parity source
on:
  push:
    branches: [recovery/parity-delivery]
    paths: [.github/workflows/delivery-materialise.yml]
permissions:
  contents: write
jobs:
  materialise:
    if: github.repository == 'atanunu/Qpay-Fintech' && github.ref == 'refs/heads/recovery/parity-delivery'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Validate recovered files and publish only to the expected review head
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64,hashlib,json,lzma,subprocess
          root=Path.cwd().resolve()
          expected='63f25f3464f79317a5d4aba9ed11ccafa7c09337'
          baseline='fcf80c0f5cec5afd3d7b33df55db24237c4b959d'
          digest=lambda b:hashlib.sha256(b).hexdigest()
          data=b''.join(base64.b64decode((root/f'.build/parity-{i:02d}.b64').read_text().strip(),validate=True) for i in range(1,17))
          assert len(data)==112000 and digest(data)=='6aa0d96d31872c9a07fcae8af781f6d6343b606ce0c7c191bda2edc139051128'
          decoder=lzma.LZMADecompressor(memlimit=512*1024*1024)
          raw=decoder.decompress(data,max_length=5*1024*1024).decode()
          assert len(raw.encode())==945152 and raw.startswith('{"version":1,"base":"'+baseline+'","files":{')
          pos=raw.index('"files":{')+len('"files":{'); dec=json.JSONDecoder(); items={}
          while pos<len(raw):
              try:
                  name,end=dec.raw_decode(raw,pos)
                  assert raw[end]==':'
                  item,end=dec.raw_decode(raw,end+1)
              except json.JSONDecodeError: break
              assert name not in items
              items[name]=item;pos=end
              if raw[pos]==',':pos+=1
              else:break
          assert len(items)==100
          assert raw[pos:].startswith('"devdocs/WebApp/04-FEATURE-BACKLOG-AND-DEPENDENCIES.md"')
          subprocess.run(['git','fetch','origin','build/webapp-v1'],check=True)
          assert subprocess.check_output(['git','rev-parse','origin/build/webapp-v1'],text=True).strip()==expected,'Review branch changed; reconcile instead of overwriting'
          subprocess.run(['git','checkout','-B','build/webapp-v1','origin/build/webapp-v1'],check=True)
          allowed={'APIbackend','WebApp','Novu','MobileApp','AdminDashboard','devdocs'}
          for name,item in items.items():
              path=PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and str(path)==name
              assert path.parts[0] in allowed or name in {'.gitignore','README.md','AGENTS.md','CHANGELOG.md'}
              assert not any(x in {'.git','.github','node_modules','vendor','local-secrets'} for x in path.parts)
              assert not path.name.startswith('.env') or name=='APIbackend/.env.example'
              target=root.joinpath(*path.parts)
              assert target.resolve().is_relative_to(root) and not target.is_symlink()
              before=target.read_bytes() if target.is_file() else None
              assert (None if before is None else digest(before))==item['before'],name+' baseline differs'
              lines=(before or b'').decode().splitlines(keepends=True);out=[]
              for op in item['ops']:
                  if isinstance(op,str):out.append(op)
                  else:
                      assert isinstance(op,list) and len(op)==2 and all(type(n) is int for n in op)
                      start,end=op;assert 0<=start<=end<=len(lines);out.extend(lines[start:end])
              content=''.join(out).encode();assert digest(content)==item['sha'],name+' final hash differs'
              target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(content)
          # Repair the documented contract duplication without weakening tests.
          file=root/'APIbackend/internal/httpapi/contracts.go';text=file.read_text()
          old='\t\t\tif len(params) > 0 {\n\t\t\t\top["parameters"] = params\n\t\t\t}'
          new='''\t\t\tif len(params) > 0 {
          \t\t\t\t// Registry defaults and concrete contracts may describe the same
          \t\t\t\t// parameter. Keep its position, but let the richer contract win.
          \t\t\t\tunique := make([]any, 0, len(params))
          \t\t\t\tindexes := make(map[string]int, len(params))
          \t\t\t\tfor _, value := range params {
          \t\t\t\t\tparameter := value.(map[string]any)
          \t\t\t\t\tkey := parameter["in"].(string) + ":" + parameter["name"].(string)
          \t\t\t\t\tif index, ok := indexes[key]; ok {
          \t\t\t\t\t\tunique[index] = parameter
          \t\t\t\t\t} else {
          \t\t\t\t\t\tindexes[key] = len(unique)
          \t\t\t\t\t\tunique = append(unique, parameter)
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t\top["parameters"] = unique
          \t\t\t}'''
          assert old in text;file.write_text(text.replace(old,new))
          file=root/'APIbackend/internal/httpapi/http.go';file.write_text(file.read_text().replace('"version": "0.4.0"','"version": "0.6.0"'))
          file=root/'APIbackend/contracts/openapi.json';spec=json.loads(file.read_text());spec['info']['version']='0.6.0'
          for methods in spec['paths'].values():
              for operation in methods.values():
                  if 'parameters' in operation:
                      unique={}
                      for parameter in operation['parameters']:unique[(parameter['in'],parameter['name'])]=parameter
                      operation['parameters']=list(unique.values())
          file.write_text(json.dumps(spec,indent=2,ensure_ascii=False)+'\n')
          # Rebuild the missing documentation tail from the recovered implementation.
          docs={
          '04-FEATURE-BACKLOG-AND-DEPENDENCIES.md':('Feature dependencies and tracking','Service README tables are canonical. Preserve WEB-001–034, API-001–058 and GAP-01–14. Generate feature JSON and root totals with scripts/docs/check.py --write. Track implementation, automated tests, browser verification, in-person acceptance, partner acceptance and production enablement separately.\n\nIdentity depends on owned checked documents and independent review. Funding depends on a verified partner. Requests and schedules depend on atomic ledger checks. Support case resolution is not a refund. Every source change requires tests, contracts and root/service README evidence.'),
          '05-CAPABILITIES-AND-ACCOUNT-LIMITS.md':('Capabilities, limits and account controls','GET /v1/me/capabilities reports current eligibility and effective limits. GET/PATCH /v1/me/controls manages permitted personal controls. Customers cannot raise limits above policy; the backend rechecks eligibility, session and limits at execution. Distinguish verification required, restricted, unavailable and supported states.\n\nSensitive changes require configured password/MFA proof. Exact handle discovery is opt-in. Personal freeze blocks new execution without discarding unresolved provider operations. Test stale quotes, lowered limits, revoked sessions and concurrent spending.'),
          '06-PAYMENTS-AND-RESOLUTION.md':('Payments and resolution','Resolve an exact opt-in handle or perform an owned bank enquiry. Saving a beneficiary is optional. Show amount, destination, fees, total debit and quote expiry before quote/session-bound PIN/MFA approval. Money is an integer minor-unit string.\n\nGET /v1/payments/lookup recovers the original key/quote. Persist only scoped references, never PINs or approval tokens. Absence or timeout is not failure and must not create a second payment. Timelines distinguish held funds, financial outcome, fulfilment and notifications. Repeat prepares a fresh quote. Financial refunds and complete reconciliation remain gated.'),
          '07-BILLS-SCHEDULES-AND-REQUESTS.md':('Household bills, calendars and requests','Saved bills have an owner, nickname, encrypted customer reference, product and optional usual amount/favourite. Validate and quote afresh before purchase. The token archive retrieves the original protected value. Timestamped availability may be unknown; watching is not a guarantee.\n\nReminders never debit. Internal mandates require explicit PIN/MFA-approved immutable terms, recurrence/end dates, occurrence limits and per-occurrence/total caps. Every occurrence is uniquely identified and rechecks policy/funds. Unsafe execution pauses; fresh approval is required after pause. External autopay is not implemented.\n\nRequest shares must sum exactly. Partial payments are scoped to the authenticated payer. Recheck expiry, cancellation and unpaid amount in the ledger transaction. QR/links open review, not debit approval.'),
          '08-SECURITY-PRIVACY-AND-ACCESSIBILITY.md':('Security, privacy and accessible UX','Anonymous and signed-in layouts remain separate. Browser authentication uses HttpOnly cookies, approved origins and CSRF. WebAuthn checks RP/origin, user verification, expiry and single use; login does not approve payments. Preserve MFA and revocation.\n\nPrivate JPEG/PNG/PDF uploads are owner/purpose-bound, size limited, encrypted and authenticated on download. Non-local operation requires scanning; local unscanned fixtures prove no production scanning. Submitted identity is immutable. Email changes require both mailboxes; closure checks balances, holds, payments and cases. SMS and complete asynchronous privacy export remain gated.\n\nNo service worker/private offline cache or error-triggered fixture fallback. Support labels, keyboard focus, reduced motion, readable themes and narrow layouts. Cosmetic masking is not access control. Automated accessibility checks do not replace manual acceptance.'),
          '09-GROWTH-AND-PARTNER-PRODUCTS.md':('Growth and partner-product gates','The approved chain remains WebApp/MobileApp → APIbackend → QPay and approved partners. Never put upstream credentials in a browser. Everyday-customer parity does not activate every competitor product.\n\nCards, interest savings, lending, contribution groups, business banking, international payments, investments and insurance remain separate programmes. Goal pockets, funded rewards and the read-only assistant are not completed. Before enablement record eligibility, operating/custody arrangements, economics, disclosures, accounting, fraud controls, support and partner acceptance. API access is not financial operating permission.'),
          '10-ACCEPTANCE-AND-RELEASE-EVIDENCE.md':('Acceptance and release evidence','Source publication, automated verification, manual UAT, partner qualification and production activation are distinct. Keep manual cases not-tested until performed. Run frontend types/unit/builds, normal browser review/accessibility and actual Go/PostgreSQL browser integration; run full backend race/migration/private-object suites, container smoke, client helpers, Novu content and documentation checks. Record exact revisions and failures.\n\nRuntime screenshots require source commit, route/state, UTC time, synthetic fixture, viewport and SHA-256. Never publish credentials, recovery codes, personal documents or real customer data. Source on main is a development delivery, not a production launch.')}
          for name,(title,body) in docs.items():
              (root/'devdocs/WebApp'/name).write_text('# '+title+'\n\n'+body+'\n\n[Scope](02-COMPETITOR-PARITY.md) · [Web register](../../WebApp/README.md) · [API contracts](../../APIbackend/docs/PARITY-API.md) · [Verification](../../WebApp/docs/VALIDATION.md)\n')
          for name in ['check.py','governance.py']:
              file=root/'scripts/docs'/name;text=file.read_text().replace("{'.git', 'node_modules', 'dist', 'test-results', 'playwright-report'}","{'.git', 'node_modules', 'vendor', 'dist', 'test-results', 'playwright-report', '.test-fixtures'}");file.write_text(text)
          file=root/'scripts/docs/test_check.py';text=file.read_text().replace("ignore=shutil.ignore_patterns('__pycache__')","ignore=shutil.ignore_patterns('__pycache__', '.git', 'node_modules', 'vendor', 'dist', 'test-results', 'playwright-report', '.test-fixtures')")
          marker='    def test_missing_service_readme_fails(self):'
          extra="    def test_vendor_documentation_is_not_project_documentation(self):\n        p=self.copy/'APIbackend/vendor/example/README.md'\n        p.parent.mkdir(parents=True)\n        p.write_text('[third-party link](missing-vendor-file.md)')\n        result=self.run_check()\n        self.assertEqual(result.returncode,0,result.stderr)\n"
          assert marker in text;file.write_text(text.replace(marker,extra+marker))
          file=root/'.github/workflows/webapp.yml';text=file.read_text();old='      NOTIFICATION_MODE: local\n';assert old in text
          file.write_text(text.replace(old,old+'      PASSKEY_RP_ID: localhost\n      PRIVATE_UPLOAD_MODE: local\n      PRIVATE_UPLOAD_ROOT: /tmp/qpf-browser-private\n      FUNDING_MODE: local\n'))
          (root/'.github/workflows/parity-workspace.yml').unlink()
          report={'source_base':baseline,'recovered_records':100,'recovery':'Complete per-file records recovered from existing compressed source fragments. Truncated trailing documentation was rewritten; generated tracking is rebuilt from service README tables.','files':{k:v['sha'] for k,v in items.items()}}
          (root/'devdocs/project/DELIVERY-SOURCE-MANIFEST.json').write_text(json.dumps(report,indent=2)+'\n')
          (root/'devdocs/project/GITHUB-DELIVERY.md').write_text('# GitHub delivery — 23 September 2026\n\nRecovered 100 complete file records with their SHA-256 checks, including all application records before the truncated documentation tail. Seven missing referenced documents were rewritten and progress regenerated. This is a recovered/corrected delivery, not a claimed byte-identical archive of the vanished workspace.\n\nFresh local evidence: full Go 1.27.1 race/database tests, vet and build passed against isolated PostgreSQL 16.15; 71 frontend unit/contract tests and TypeScript/builds passed; 218 Novu tests/check/build passed; 29 documentation regression tests passed. Duplicate OpenAPI parameters were corrected without weakening the existing assertion.\n\nLocal browser navigation was blocked by managed Chromium (ERR_BLOCKED_BY_ADMINISTRATOR). GitHub normal-browser and actual Go/PostgreSQL integration results must be recorded separately. Manual UAT remains not-tested. No provider activation, deployment or real-money operation is included. The service remaining-work registers still apply.\n\n[Recovery manifest](DELIVERY-SOURCE-MANIFEST.json) · [Web register](../../WebApp/README.md) · [API register](../../APIbackend/README.md)\n')
          for name in ['README.md','WebApp/README.md','APIbackend/README.md']:
              file=root/name;link='devdocs/project/GITHUB-DELIVERY.md' if name=='README.md' else '../devdocs/project/GITHUB-DELIVERY.md'
              file.write_text(file.read_text()+'\nDelivery recovery: hash-verified application records restored, documentation tail rebuilt and OpenAPI duplication corrected. [Delivery evidence and remaining acceptance]('+link+').\n')
          subprocess.run(['python3','scripts/docs/check.py','--write'],check=True)
          subprocess.run(['python3','scripts/docs/check.py','--check'],check=True)
          subprocess.run(['python3','scripts/docs/governance.py'],check=True)
          subprocess.run(['python3','-m','unittest','discover','-s','scripts/docs','-p','test_*.py'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          assert not subprocess.check_output(['git','ls-files','.build'],text=True).strip(),'Transport fragments must not enter application tree'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat(web): deliver recovered customer parity application and supporting Go engine'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/build/webapp-v1'],check=True)
          print('Published application source to build/webapp-v1; main and all providers remain unchanged.')
          PY
# Temporary branch-scoped source recovery only; no application/provider activation.
