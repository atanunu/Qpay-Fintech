name: Parity dependency qualification
on:
  push:
    branches: [build/webapp-v1]
    paths: [.github/workflows/parity-workspace.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: false
      - name: Resolve fixed upstream libraries without activation
        shell: bash
        run: |
          set -euo pipefail
          cd APIbackend
          mkdir -p internal/workspacedeps /tmp/qpf-deps
          printf 'package workspacedeps\nimport (_ "github.com/go-webauthn/webauthn/webauthn"; _ "github.com/minio/minio-go/v7")\n' > internal/workspacedeps/deps.go
          go get github.com/go-webauthn/webauthn@v0.18.2 github.com/minio/minio-go/v7@v7.3.0
          go mod tidy
          go mod download
          go mod verify
          go mod vendor
          tar -czf /tmp/qpf-deps/dependencies.tar.gz vendor go.mod go.sum
          tar -C "$(go env GOMODCACHE)" -czf /tmp/qpf-deps/module-cache.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parity-dependencies
          retention-days: 2
          compression-level: 0
          path: /tmp/qpf-deps/
# Temporary read-only dependency qualification. No provider, credential or deployment calls.
