# In-person test deployment template. Replace api.example.invalid with the exact
# reviewed API origin, and pin the server image before production acceptance.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.example.invalid; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
  location / { try_files $uri $uri/ /index.html; }
  location ~ /\. { deny all; }
}
