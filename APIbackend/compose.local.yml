# Local synthetic development only. No external bank or email provider is used.
name: qpay-fintech-local
x-app: &app
  image: qpay-fintech-api:local
  build:
    context: ..
    dockerfile: APIbackend/Dockerfile
  env_file: .env.local
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: qpf
      POSTGRES_USER: qpf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env.local first}
    volumes: [qpf-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U qpf -d qpf']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    <<: *app
    entrypoint: [/app/bin/migrate]
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    <<: *app
    entrypoint: [/app/bin/worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
  scheduler:
    <<: *app
    entrypoint: [/app/bin/scheduler]
    depends_on:
      migrate: {condition: service_completed_successfully}
  control:
    <<: *app
    entrypoint: [/app/bin/qpfctl]
    profiles: [tools]
    restart: 'no'
    volumes: ['./local-secrets:/run/qpf-secrets:ro']
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  qpf-data:
