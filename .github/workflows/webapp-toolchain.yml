name: Pinned backend integration source
on:
  push:
    branches: [build/webapp-v1]
    paths: ['.github/workflows/webapp-toolchain.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: 3c72503c0969951a0d9f56dbc8f38b2fe8f581ef
      - name: Archive exact existing backend candidate
        run: git archive --format=tar.gz HEAD > /tmp/backend-candidate.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-source
          retention-days: 2
          path: /tmp/backend-candidate.tar.gz
# Read-only source inspection. No dependencies, secrets, providers or deployment.
