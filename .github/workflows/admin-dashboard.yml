name: Admin dashboard verification
on:
  push:
    branches: [main, build/admin-dashboard-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: admin-review-accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AdminDashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: AdminDashboard/package-lock.json
      - name: Install exact dependency lock
        run: npm ci
      - name: Types, unit and canonical template contracts
        run: npm run typecheck && npm test && python3 scripts/check_content.py
      - name: Build API release without review credentials
        run: |
          npm run build
          if grep -R 'Admin-review-only-2026' dist/assets; then exit 1; fi
      - name: Build isolated review release
        run: npm run build:review
      - name: Install normal browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser journeys, role gates, accessibility and runtime screenshots
        env:
          QPF_CAPTURE_ADMIN: 'true'
        run: npm run test:e2e
      - name: Package source-bound review screenshots
        run: python3 scripts/capture_manifest.py
      - name: Static non-root container build
        run: docker build --file Dockerfile --tag qpf-admin-review:ci ..
      - name: Static server routing and security headers
        run: |
          docker run -d --name qpf-admin-static -p 127.0.0.1:18080:8080 qpf-admin-review:ci
          python3 - <<'PY'
          import time
          from urllib.request import urlopen
          for i in range(30):
              try:
                  with urlopen('http://127.0.0.1:18080/records/customers',timeout=3) as r:
                      assert r.status==200 and r.headers['Cache-Control']=='no-store'
                      assert r.headers['X-Frame-Options']=='DENY'
                      assert 'noindex' in r.headers['X-Robots-Tag']
                      assert "frame-ancestors 'none'" in r.headers['Content-Security-Policy']
                      assert '<div id="root">' in r.read().decode()
                      break
              except Exception:
                  if i==29: raise
                  time.sleep(1)
          PY
      - name: Remove isolated static container
        if: always()
        run: docker rm -f qpf-admin-static || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: admin-review-evidence
          retention-days: 7
          path: |
            AdminDashboard/test-results/review-report.json
            AdminDashboard/playwright-report/review/
            AdminDashboard/evidence/gallery/
  integration:
    name: admin-real-go-postgres-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: qpf_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: qpf_admin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qpf_test -d qpf_admin_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://qpf_test:synthetic_ci_only@localhost:5432/qpf_admin_test?sslmode=disable
      QPF_ENV: local
      EXECUTION_MODE: local
      NOTIFICATION_MODE: local
      PRIVATE_UPLOAD_MODE: local
      PRIVATE_UPLOAD_ROOT: /tmp/qpf-admin-private
      FUNDING_MODE: local
      WEB_ORIGINS: http://localhost:5173
      ADMIN_ORIGINS: http://localhost:5174
      HTTP_ADDR: 127.0.0.1:8080
      VITE_ADMIN_MODE: api
      VITE_API_BASE_URL: http://localhost:8080
      VITE_ALLOW_LOCAL_HTTP: 'true'
      QPF_ADMIN_TEST_MODE: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: AdminDashboard/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: false
      - name: Generate isolated encryption material
        run: |
          python3 - <<'PY'
          import os,secrets,base64
          key=lambda:base64.b64encode(secrets.token_bytes(32)).decode()
          values={'AUTH_PEPPER':key(),'DATA_KEY_ID':'test','DATA_KEYS':'test:'+key(),'NOTIFICATION_POLICY_KEY':key()}
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k,v in values.items():
                  if k!='DATA_KEY_ID': print('::add-mask::'+v)
                  f.write(k+'='+v+'\n')
          PY
      - name: Build and migrate real service
        working-directory: APIbackend
        run: |
          go mod verify
          go build -o /tmp/qpf-api ./cmd/api
          go build -o /tmp/qpf-worker ./cmd/worker
          go build -o /tmp/qpfctl ./cmd/qpfctl
          go run ./cmd/migrate
          /tmp/qpf-api > /tmp/qpf-admin-api.log 2>&1 &
          /tmp/qpf-worker > /tmp/qpf-admin-worker.log 2>&1 &
      - name: Normal staff bootstrap, independent invitations and MFA fixtures
        run: python3 AdminDashboard/e2e/api-fixture.py
      - name: Install locked frontend and normal browser
        working-directory: AdminDashboard
        run: npm ci && npx --no-install playwright install --with-deps chromium
      - name: Actual cookie, MFA, permission, approval, evidence and support journeys
        working-directory: AdminDashboard
        run: npm run test:e2e:api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: admin-api-evidence
          retention-days: 3
          path: |
            AdminDashboard/test-results/api-report.json
            /tmp/qpf-admin-api.log
            /tmp/qpf-admin-worker.log
      - name: Remove ephemeral identities and private documents
        if: always()
        run: rm -rf AdminDashboard/.test-fixtures /tmp/qpf-admin-private
# Disposable synthetic finances only; no production credentials, external providers or deployment.
