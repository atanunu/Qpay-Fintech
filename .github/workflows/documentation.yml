name: Documentation integrity
on:
  push:
    branches: [main, build/webapp-v1, build/admin-dashboard-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    name: documentation-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate canonical registers and local links
        run: python3 scripts/docs/check.py --check
      - name: Validate governance, structure and visual provenance
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/docs/governance.py --base "$DOCS_BASE_SHA"
      - name: Run documentation regression tests
        run: python3 -m unittest discover -s scripts/docs -p 'test_*.py' -v
  notification-content:
    name: notification-content-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select content-test Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate content summary and renderability
        run: npm --prefix Novu run check
      - name: Execute offline content and workflow-contract tests
        run: npm --prefix Novu test
      - name: Build portable content bundle
        run: npm --prefix Novu run build
# Read-only checks. No providers, Novu sync or infrastructure deployment.
