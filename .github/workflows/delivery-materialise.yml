name: Publish recovered parity source
on:
  push:
    branches: [recovery/parity-delivery]
    paths: [.github/workflows/delivery-materialise.yml]
permissions:
  contents: write
jobs:
  materialise:
    if: github.repository == 'atanunu/Qpay-Fintech' && github.ref == 'refs/heads/recovery/parity-delivery'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply hash-verified source without modifying workflows
        run: |
          python3 - <<'PY'
          import subprocess,textwrap,hashlib
          reference='548f7488be12cca1c99a312e0a797555efa1fdb6:.github/workflows/delivery-materialise.yml'
          original=subprocess.check_output(['git','show',reference])
          blob=hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()
          assert blob=='d5ec625d2bf31141fc921a279daf17efa2a93364'
          lines=original.decode().splitlines()
          start=next(i for i,line in enumerate(lines) if line.strip()=="python3 - <<'PY'")+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          script=textwrap.dedent('\n'.join(lines[start:end]))
          marker="subprocess.run(['git','add','-A'],check=True)"
          assert script.count(marker)==1
          script=script.replace(marker,"subprocess.run(['git','restore','--source=HEAD','--worktree','--','.github'],check=True)\n"+marker)
          # The original 100-record source hashes, expected target head, safe-path
          # validation, docs checks and non-force push are all retained.
          exec(compile(script,'verified-source-recovery.py','exec'))
          PY
# Native repository connection will handle authorised workflow edits separately.
