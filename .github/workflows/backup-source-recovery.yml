name: Recover backup source fragments
on:
  push:
    branches: [build/backup-recovery-v1]
    paths: [.github/workflows/backup-source-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'atanunu/Qpay-Fintech' && github.ref == 'refs/heads/build/backup-recovery-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recover exact Git blobs without executing application source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,subprocess,urllib.request
          out=Path('/tmp/backup-source-recovery');out.mkdir()
          shas=['54eff877029c3fd65168a16e2370cd89b3203bc3','ed8e61b7be57d80b60082072fb15dba75149eb55','ec3877cc0ebd528526fd111777f6963245b5f2e9','26c678d950fa29a2fe3db335d10e6db10560d3f8','42c5a909610ca6ad492882ecf278f75340b43a37','0f3ce0412ea456cb3739b34c357385fbf53b2ea9']
          receipts=[]
          for index,sha in enumerate(shas,1):
              raw=subprocess.check_output(['gh','api',f'repos/atanunu/Qpay-Fintech/git/blobs/{sha}'])
              obj=json.loads(raw);blob=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(blob)).encode()+b'\0'+blob).hexdigest()==sha
              (out/f'part-{index:02}.bin').write_bytes(blob)
              receipts.append({'part':index,'git_sha':sha,'size':len(blob),'sha256':hashlib.sha256(blob).hexdigest()})
          (out/'receipts.json').write_text(json.dumps(receipts,indent=2))
          subprocess.run(['git','bundle','create',str(out/'source.bundle'),'HEAD','refs/remotes/origin/main'],check=True)
          print(json.dumps(receipts,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backup-source-recovery
          retention-days: 3
          path: /tmp/backup-source-recovery/
# Read-only recovery of existing code objects. No provider connection, credentials export or deployment.
