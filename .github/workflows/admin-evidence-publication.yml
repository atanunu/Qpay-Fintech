name: Publish reviewed admin evidence
on:
  push:
    branches: [build/admin-dashboard-v1]
    paths: [.github/workflows/admin-evidence-publication.yml]
permissions:
  contents: write
  actions: read
jobs:
  publication:
    if: github.repository == 'atanunu/Qpay-Fintech' && github.ref == 'refs/heads/build/admin-dashboard-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify inspected artifacts and publish documentation only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib,io,json,os,re,subprocess,zipfile
          from urllib.request import Request,build_opener,HTTPRedirectHandler,urlopen
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          root=Path.cwd().resolve()
          repo='atanunu/Qpay-Fintech'
          source='f7e91005d83fcedc56ecec1da4fa6c47c251a52f'
          captured='79ceb97aa548f06f9eab5f292f07491efae45dac'
          manifest=Path('.build/admin-delivery-docs.json')
          workflow='.github/workflows/admin-evidence-publication.yml'
          changed=set(subprocess.check_output(['git','diff','--name-only',source,'HEAD','--'],text=True).splitlines())
          assert changed <= {str(manifest),workflow,'devdocs/project/ADMIN-DELIVERY.md'},'Unexpected concurrent implementation change'
          digest=lambda b:hashlib.sha256(b).hexdigest()
          base='https://api.github.com/repos/'+repo
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=build_opener(NoRedirect())
          def request(path):
              return Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          def api(path):
              with opener.open(request(path),timeout=30) as r:
                  raw=r.read(2*1024*1024+1)
              assert len(raw)<=2*1024*1024
              return json.loads(raw)
          for run in (35961917855,35961917926,35961917828,35961917885):
              data=api('/actions/runs/'+str(run))
              assert data['head_sha']==source and data['status']=='completed' and data['conclusion']=='success',str(run)
          def artifact(ident,expected):
              meta=api('/actions/artifacts/'+str(ident))
              assert not meta['expired'] and meta['workflow_run']['id']==35961917855 and meta['workflow_run']['head_sha']==source
              assert meta['digest']=='sha256:'+expected
              try:
                  with opener.open(request('/actions/artifacts/'+str(ident)+'/zip'),timeout=30) as r: raw=r.read(20*1024*1024+1)
              except HTTPError as e:
                  assert e.code==302
                  url=e.headers['Location'];parts=urlsplit(url)
                  assert parts.scheme=='https' and parts.hostname and not parts.username and not parts.password
                  # Never forward GitHub credentials to the artifact's signed storage URL.
                  with urlopen(Request(url),timeout=60) as r: raw=r.read(20*1024*1024+1)
              assert len(raw)<=20*1024*1024 and digest(raw)==expected,'Artifact digest mismatch'
              z=zipfile.ZipFile(io.BytesIO(raw))
              assert len(z.namelist())==len(set(z.namelist())) and sum(i.file_size for i in z.infolist())<50*1024*1024
              assert all(not PurePosixPath(n).is_absolute() and '..' not in PurePosixPath(n).parts for n in z.namelist())
              return z
          review=artifact(10792652458,'eaf71e660464aec665b77724222bc6a4b74ab6d446d0e8491bb14efe237c552d')
          backend=artifact(10792717318,'48a3287716acb61eff73ea61ff213cb89fe6523d0b71a06db8d5c3a058c893d6')
          def report(z,suffix,count):
              names=[n for n in z.namelist() if n.endswith(suffix)];assert len(names)==1
              value=json.loads(z.read(names[0]));s=value['stats']
              assert s['expected']==count and all(s[k]==0 for k in ('unexpected','skipped','flaky')) and not value.get('errors')
              def walk(suites):
                  for suite in suites:
                      for spec in suite.get('specs',[]):
                          for test in spec['tests']:
                              assert len(test['results'])==1 and test['results'][0]['status']=='passed' and test['results'][0]['retry']==0
                      walk(suite.get('suites',[]))
              walk(value['suites'])
              return s
          review_stats=report(review,'test-results/review-report.json',19)
          api_stats=report(backend,'test-results/api-report.json',11)
          data=json.loads(manifest.read_text())
          raw=(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n').encode()
          assert digest(raw)=='8176c9473ce46480970092073e7bbc103d6c81542f0751c4d4f28922bef79fe4'
          allowed={'README.md','AdminDashboard/README.md','AdminDashboard/docs/VALIDATION.md','APIbackend/README.md','devdocs/AdminDashboard/05-TESTING.md','AdminDashboard/docs/DELIVERY-VERIFICATION.json','AdminDashboard/docs/FEATURES.json','APIbackend/docs/FEATURES.json','devdocs/project/PROGRESS.json'}
          assert set(data)==allowed
          pending={}
          for name,item in data.items():
              p=root/name
              assert p.resolve().is_relative_to(root) and not any(q.is_symlink() for q in [p,*p.parents] if q.is_relative_to(root))
              before=p.read_bytes() if p.is_file() else None
              assert (None if before is None else digest(before))==item['before'],'Concurrent documentation change: '+name
              text=(before or b'').decode();pieces=[];last=0
              for start,end,value in item['edits']:
                  assert type(start) is int and type(end) is int and last<=start<=end<=len(text) and isinstance(value,str)
                  pieces.extend((text[last:start],value));last=end
              pieces.append(text[last:]);after=''.join(pieces).encode()
              assert digest(after)==item['after'],'Final documentation digest differs: '+name
              pending[name]=after
          prefix='evidence/gallery/'
          gallery=json.loads(review.read(prefix+'SCREENSHOTS.json'))
          assert gallery['status']=='captured' and gallery['service']=='AdminDashboard' and len(gallery['captures'])==41
          seen=set()
          for item in gallery['captures']:
              rel=item['path'];assert re.fullmatch(r'images/[a-z0-9-]+\.png',rel) and rel not in seen
              seen.add(rel)
              assert item['source_commit']==captured and item['environment']=='test' and item['fixture_id']=='admin-review-v0.7-public-synthetic'
              content=review.read(prefix+rel)
              assert content[:8]==b'\x89PNG\r\n\x1a\n' and digest(content)==item['sha256']
              pending['AdminDashboard/docs/'+rel]=content
          for name in ('SCREENSHOTS.md','SCREENSHOTS.json'):pending['AdminDashboard/docs/'+name]=review.read(prefix+name)
          for name,content in pending.items():
              p=root/name
              assert p.resolve().is_relative_to(root) and not any(q.is_symlink() for q in [p,*p.parents] if q.is_relative_to(root))
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(content);p.chmod(0o644)
          subprocess.run(['make','docs-check'],check=True)
          subprocess.run(['make','docs-test'],check=True)
          subprocess.run(['git','add','--',*pending],check=True)
          subprocess.run(['git','rm','--',str(manifest),workflow],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','docs(admin): publish 41 verified runtime captures and current CI evidence'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/build/admin-dashboard-v1'],check=True)
          out=Path('/tmp/admin-publication');out.mkdir(exist_ok=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          (out/'publication.json').write_text(json.dumps({'commit':commit,'source_head':source,'captures':41,'review':review_stats,'api':api_stats,'documentation_checks':'passed','main_merged':False},indent=2)+'\n')
          with (out/'source.tar.gz').open('wb') as f:subprocess.run(['git','archive','--format=tar.gz','HEAD'],stdout=f,check=True)
          print('Published inspected documentation and 41 PNGs; temporary publication files removed. Commit: '+commit)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-publication-receipt
          retention-days: 3
          path: /tmp/admin-publication/
# One-time documentation/image publication only. It cannot edit application source,
# tests, financial state, provider configuration or main; never executes artifact content.
