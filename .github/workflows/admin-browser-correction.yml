name: Apply reviewed admin continuation
on:
  push:
    branches: [build/admin-dashboard-v1]
    paths: [.github/workflows/admin-browser-correction.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'atanunu/Qpay-Fintech' && github.ref == 'refs/heads/build/admin-dashboard-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Apply exact before-and-after verified source without executing it
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib,json,subprocess
          root=Path.cwd().resolve()
          manifest=Path('.build/admin-browser-fixes.json')
          data=json.loads(manifest.read_text())
          raw=(json.dumps(data,ensure_ascii=True,separators=(',',':'))+'\n').encode()
          digest=lambda b:hashlib.sha256(b).hexdigest()
          assert digest(raw)=='6d1c9165f1c1a9584be3940b9d9104d503369353a99d6df498e4c1ef640cf0c1'
          assert len(data)==16
          pending=[]
          for name,item in data.items():
              rel=PurePosixPath(name)
              assert not rel.is_absolute() and '..' not in rel.parts and str(rel)==name
              assert rel.parts[0]=='AdminDashboard' or name in ('README.md','CHANGELOG.md')
              assert not any(x in ('.git','.github','node_modules','.test-fixtures') for x in rel.parts)
              assert not rel.name.startswith('.env')
              p=root.joinpath(*rel.parts)
              assert p.resolve().is_relative_to(root)
              assert not any(x.is_symlink() for x in [p,*p.parents] if x.is_relative_to(root))
              before=p.read_bytes() if p.is_file() else None
              assert (None if before is None else digest(before))==item['before'],f'Concurrent change: {name}'
              text=(before or b'').decode('utf-8');pieces=[];last=0
              for start,end,value in item['edits']:
                  assert type(start) is int and type(end) is int and last<=start<=end<=len(text)
                  assert isinstance(value,str)
                  pieces.extend((text[last:start],value));last=end
              pieces.append(text[last:]);after=''.join(pieces).encode('utf-8')
              assert digest(after)==item['after'],f'Final hash mismatch: {name}'
              pending.append((name,p,after))
          for name,p,after in pending:
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(after);p.chmod(0o644)
          subprocess.run(['git','add','--',*[n for n,_,_ in pending]],check=True)
          subprocess.run(['git','rm','--',str(manifest),'.github/workflows/admin-browser-correction.yml','.github/workflows/admin-source-snapshot.yml'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','fix(admin): complete browser accessibility, MFA acknowledgement and evidence isolation'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/build/admin-dashboard-v1'],check=True)
          print('Published 16 hash-verified source/test/documentation files; temporary transports removed.')
          PY
# Exact-source transport only. No production operation, secret, provider or deployment.
