name: Backend verification
on:
  push:
    branches: [main, 'build/api-backend-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: qpf_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: qpf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qpf_test -d qpf_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://qpf_test:synthetic_ci_only@localhost:5432/qpf_test?sslmode=disable
      QPF_REQUIRE_POSTGRES: 'true'
    defaults:
      run:
        working-directory: APIbackend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: false
      - name: Resolve and verify module checksums
        run: go mod tidy && go mod verify
      - name: Vet
        run: go vet ./...
      - name: Race and real PostgreSQL suites
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          go test -race -count=1 -timeout=10m -json ./... | tee evidence/go-tests.jsonl
      - name: Build all processes and export contracts
        run: |
          go build ./...
          go run ./cmd/contracts
          go version > evidence/go-version.txt
          psql "$TEST_DATABASE_URL" -Atc 'select version()' > evidence/postgres-version.txt
      - name: Test client helper
        run: node --test clients/client.test.mjs
      - name: Upload verification evidence and generated contracts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-verification
          retention-days: 7
          path: |
            APIbackend/go.mod
            APIbackend/go.sum
            APIbackend/evidence/
            APIbackend/contracts/
# Synthetic test database only. No production secrets or external payment calls.
